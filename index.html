<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Human Anatomy Database</title>
<style>
:root {
	--bg-color: oklch(0.95 0 0);
	--card-bg: oklch(1 0 0);
	--card-border: oklch(0.8 0 0);
	--text-main: oklch(0.2 0 0);
	--text-muted: oklch(0.5 0 0);
	--shadow-base: oklch(0 0 0 / 0.5);
	--shadow-hover: oklch(0 0 0 / 0.8);

	--ui-bg: oklch(1 0 0);
	--ui-border: oklch(0.8 0 0);
	--ui-shadow: oklch(0 0 0 / 0.5);
	--search-hover: oklch(0.95 0 0);

	--text-lightness: 0.6;
	--text-hover-lightness: 0.7;
	--text-chroma: 0.18;
	--text-hover-chroma: 0.2;
	--card-lightness: 0.975;
	--card-chroma: 0;
	--card-hover-lightness: 1;
	--card-hover-chroma: 0;
	--card-hue: 220;
	--shadow-lightness: 0.3;
	--shadow-chroma: 0.1;

	--hue-female: 340;
	--hue-male: 240;
	--hue-shared: 140;

	--hue-anatomy: 200;
	--hue-removed: 20;
	--hue-consequence: 60;
	--hue-benefit: 160;
	--hue-harm: 40;
	--hue-url: 240;

	--trait-male: oklch(var(--text-lightness) var(--text-chroma) var(--hue-male));
	--trait-female: oklch(var(--text-lightness) var(--text-chroma) var(--hue-female));
	--trait-shared: oklch(var(--text-lightness) var(--text-chroma) var(--hue-shared));

	--center-bg: oklch(var(--card-hover-lightness) var(--card-hover-chroma) var(--card-hue));

	--url-color: oklch(var(--text-lightness) var(--text-chroma) var(--hue-url));
	--url-hover: oklch(min(var(--text-lightness) + 0.1, 0.9) var(--text-chroma) var(--hue-url));
}

@media (prefers-color-scheme: dark) {
	:root {
		--bg-color: oklch(0.2 0 0);
		--card-bg: oklch(0.25 0 0);
		--card-border: oklch(0.3 0 0);
		--text-main: oklch(0.8 0 0);
		--text-muted: oklch(0.6 0 0);
		--shadow-base: oklch(var(--shadow-lightness) var(--shadow-chroma) 0 / 0.3);
		--shadow-hover: oklch(var(--shadow-lightness) var(--shadow-chroma) 0 / 0.6);

		--ui-bg: oklch(0.2 0 0);
		--ui-border: oklch(0.3 0 0);
		--ui-shadow: oklch(var(--shadow-lightness) 0 0 / 0.5);
		--search-hover: oklch(0.3 0 0);

		--trait-male: oklch(var(--text-lightness) var(--text-chroma) var(--hue-male));
		--trait-female: oklch(var(--text-lightness) var(--text-chroma) var(--hue-female));
		--trait-shared: oklch(var(--text-lightness) var(--text-chroma) var(--hue-shared));

		--text-lightness: 0.8;
		--text-chroma: 0.12;
		--text-hover-lightness: 0.9;
		--text-hover-chroma: 0.15;
		--card-lightness: 0.25;
		--card-chroma: 0.0;
		--card-hover-lightness: 0.25;
		--card-hover-chroma: 0;
		--card-hue: 240;
		--shadow-lightness: 0.7;
		--shadow-chroma: 0.1;
	}
}

* {
	box-sizing: border-box;
	scrollbar-width: thin;
	scrollbar-gutter: auto;
	corner-shape: squircle;
	text-wrap-style: pretty;
}
html {
	font-size: clamp(.875rem, 1vw + 0.25rem, 1.125rem);
}

body {
	margin: 0;
	padding: 0;
	background-color: var(--bg-color);
	color: var(--text-main);
	font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
	overflow: hidden;
	user-select: none;
	transition: background-color 0.3s, color 0.3s;
}
a {
	color: var(--url-color);
	text-decoration: none;
	transition: color 0.3s;
	&:hover {
		color: var(--url-hover);
		text-decoration: underline;
	}
}

#app {
	position: relative;
	width: 100svw;
	height: 100svh;
}

#lines-layer {
	position: absolute;
	top: 0;
	left: 0;
	width: 100%;
	height: 100%;
	z-index: 1;
	pointer-events: none;
}

#nodes-layer {
	position: absolute;
	top: 0;
	left: 0;
	width: 100%;
	height: 100%;
	z-index: 2;
}

.card {
	position: absolute;
	min-width: 10em;
	max-width: 20em;
	--_back: oklch(var(--card-lightness) var(--card-chroma) var(--card-hue));
	background: var(--_back);
	@supports (backdrop-filter: blur(0)) {
		--_back: oklch(var(--card-lightness) var(--card-chroma) var(--card-hue) / 0.2);
		backdrop-filter: blur(1em);
	}

	border: .125em solid oklch(var(--text-lightness) var(--text-chroma) var(--_hue));
	border-radius: 1em;
	padding: 2.25em 1em 1em 1em;
	box-shadow: 0 0 1em -0.25em oklch(var(--shadow-lightness) var(--shadow-chroma) var(--_hue) / 0.5);
	cursor: grab;
	translate: -50% -50%;
	transform-origin: center;
	transition:
		scale 0.3s cubic-bezier(0.25, 0.8, 0.25, 1),
		left 0.5s cubic-bezier(0.25, 0.8, 0.25, 1),
		top 0.5s cubic-bezier(0.25, 0.8, 0.25, 1),
		box-shadow 0.3s ease,
		filter 0.3s ease,
		background-color 0.3s ease,
		border-color 0.3s ease,
		opacity 0.3s ease;
	text-align: center;
	&:active { cursor: grabbing; }
	&.hidden { opacity: 0; pointer-events: none; }
	&.target { z-index: 2; scale: 1.0; }
	&.source { z-index: 1; scale: 0.9; }
	&.parent { z-index: 0; scale: 0.8; filter: saturate(0.5); }
	&:hover {
		box-shadow: 0 1em 1em -.5em oklch(var(--shadow-lightness) var(--shadow-chroma) var(--_hue) / 0.8);
		--text-lightness: var(--text-hover-lightness);
		--text-chroma: var(--text-hover-chroma);
		z-index: 5;
		scale: 1.05;
	}

	&.trait-male { --_text-hue: var(--hue-male); }
	&.trait-female { --_text-hue: var(--hue-female); }
	&.trait-shared { --_text-hue: var(--hue-shared); }

	&.type-anatomy   { --_hue: var(--hue-anatomy); }
	&.type-removed   { --_hue: var(--hue-removed); }
	&.type-consequence { --_hue: var(--hue-consequence); }
	&.type-benefit   { --_hue: var(--hue-benefit); }
	&.type-harm      { --_hue: var(--hue-harm); }

	.card-icon {
		position: absolute;
		top: -1.5em;
		left: 50%;
		transform: translateX(-50%);
		width: 3em;
		height: 3em;
		background-color: var(--card-bg);
		border: .125em solid oklch(var(--text-lightness) var(--text-chroma) var(--_text-hue));
		border-radius: 100%;
		padding: .25em;
		corner-shape: round;
		fill: oklch(var(--text-lightness) var(--text-chroma) var(--_text-hue));
		color: oklch(var(--text-lightness) var(--text-chroma) var(--_text-hue));
		pointer-events: none;
	}

	h3 {
		margin: 0 0 0.5em 0;
		font-size: 1.25em;
		transition: color 0.3s ease;
		color: oklch(var(--text-lightness) var(--text-chroma) var(--_text-hue));
	}
	p {
		margin: 0;
		font-size: 0.95em;
		color: var(--text-muted);
	}
	&.center-node {
		min-width: 14em;
		z-index: 100;
		background-color: var(--center-bg);
		box-shadow: 0 1em 2em -.5em oklch(var(--shadow-lightness) var(--shadow-chroma) var(--_hue) / 0.8);
		@supports (backdrop-filter: blur(0)) {
			background-color: var(--center-bg) with alpha(var(--center-bg) / 0.8);
			backdrop-filter: blur(2em);
		}
	}
	&.dragging {
		transition: box-shadow 0.3s ease, filter 0.3s ease, background-color 0.3s ease !important;
		z-index: 100 !important;
	}
	&.ghosted { filter: grayscale(80%); }
	&.ghosted:hover { filter: grayscale(20%); }
	&.center-node.ghosted { filter: grayscale(40%); }
}

#top-bar {
	position: fixed;
	top: 1em;
	left: 1em;
	right: 1em;
	height: 3em;
	z-index: 200;
	display: flex;
	flex-direction: column;
	align-items: stretch;
}

#breadcrumb-stack {
	background: var(--ui-bg);
	padding: .5em 1em;
	border-radius: .5em;
	corner-shape: squircle;
	display: flex;
	flex-wrap: wrap;
	flex-direction: row;
	justify-content: flex-end;
	overflow: clip;
	gap: .25em;
	align-items: center;
	flex: 1 1 100%;
	transition: background-color 0.3s;
}
.breadcrumb-item { cursor: pointer; color: var(--url-color); font-weight: 500; transition: color 0.2s; }
.breadcrumb-item:hover { color: var(--url-hover); text-decoration: underline; }
.breadcrumb-separator { color: var(--text-muted); font-size: 12px; margin: 0 4px; }
.breadcrumb-current { color: var(--text-main); font-weight: bold; cursor: default; }

#controls-container {
	display: flex;
	gap: 1em;
	max-width: 20em;
	align-self: flex-end;
}

#category-filter {
	padding: 12px 15px;
	background: var(--ui-bg);
	color: var(--text-main);
	border: 1px solid var(--ui-border);
	border-radius: .5em;
	font-size: 14px;
	box-shadow: 0 2px 10px var(--ui-shadow);
	outline: none;
	cursor: pointer;
	transition: border-color 0.3s, background-color 0.3s, color 0.3s;
	width: 40%;
}
#category-filter:focus { border-color: var(--url-color); }

#search-container { position: relative; flex-grow: 1; }

#search-input {
	width: 100%;
	padding: 12px 15px;
	background: var(--ui-bg);
	color: var(--text-main);
	border: 1px solid var(--ui-border);
	border-radius: .5em;
	font-size: 14px;
	box-sizing: border-box;
	box-shadow: 0 2px 10px var(--ui-shadow);
	outline: none;
	transition: border-color 0.3s, background-color 0.3s, color 0.3s;
}
#search-input::placeholder { color: var(--text-muted); }
#search-input:focus { border-color: var(--url-color); }

#search-results {
	margin-top: .5em;
	background: var(--ui-bg);
	border-radius: .5em;
	box-shadow: 0 4px 20px var(--ui-shadow);
	max-height: 350px;
	overflow-y: auto;
	display: none;
	border: 1px solid var(--ui-border);
	position: absolute;
	width: 100%;
}
.search-result-item {
	padding: 12px 15px;
	cursor: pointer;
	border-bottom: 1px solid var(--ui-border);
	transition: background-color 0.2s;
}
.search-result-item:last-child { border-bottom: none; }
.search-result-item:hover { background-color: var(--search-hover); }
.search-result-title { font-weight: 600; color: var(--text-main); font-size: 14px; margin-bottom: 4px; }
.search-result-meta { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

#legend,
#copyright,
#controls-container,
#breadcrumb-stack {
	position: absolute;
	background: var(--ui-bg);
	border-radius: .5em;
	min-height: 2em;
	z-index: 200;
}

#legend, #category-filter, #search-input, #breadcrumb-stack {
	box-shadow: 0 0 .5em var(--ui-shadow);
	border: .125em solid var(--ui-border);
	background: var(--ui-bg);
	@supports (backdrop-filter: blur(0)) {
		background: var(--ui-bg) with alpha(var(--ui-bg) / 0.2);
		backdrop-filter: blur(1em);
	}
}

#legend { bottom: 1em; left: 1em; padding: 1em; }
.legend-section-title { font-weight: bold; margin-bottom: .5em; color: var(--text-main); }
.legend-divider { height: .1em; background: var(--ui-border); margin: .5em 0; }
.legend-item { display: flex; align-items: center; margin-bottom: .5em; }
.legend-item:last-child { margin-bottom: 0; }
.legend-line { width: 3em; height: .2em; margin-right: 1em; }
.legend-line.anatomy { background: oklch(var(--text-lightness) var(--text-chroma) var(--hue-anatomy)); }
.legend-line.removed { border-bottom: 3px dashed oklch(var(--text-lightness) var(--text-chroma) var(--hue-removed)); height: 0; }
.legend-line.consequence { background: oklch(var(--text-lightness) var(--text-chroma) var(--hue-consequence)); }
.legend-line.benefit { border-bottom: 3px dotted oklch(var(--text-lightness) var(--text-chroma) var(--hue-benefit)); height: 0; }
.legend-line.harm { border-bottom: 3px dotted oklch(var(--text-lightness) var(--text-chroma) var(--hue-harm)); height: 0; }

.legend-text-icon { font-weight: bold; font-size: 14px; width: 3em; text-align: center; margin-right: 1em; }
.legend-text-icon.male { color: var(--trait-male); }
.legend-text-icon.female { color: var(--trait-female); }
.legend-text-icon.shared { color: var(--trait-shared); }

.legend-line {
	&.anatomy { --_hue: var(--hue-anatomy); }
	&.removed { --_hue: var(--hue-removed); }
	&.consequence { --_hue: var(--hue-consequence); }
	&.benefit { --_hue: var(--hue-benefit); }
	&.harm { --_hue: var(--hue-harm); }
	line {
		stroke: oklch(var(--text-lightness) var(--text-chroma) var(--_hue));
		stroke-width: 3;
	}
}
#copyright {
	bottom: 1em;
	right: 1em;
	padding: .5em 1em;
	font-size: 12px;
	color: var(--text-muted);
	border: none;
	box-shadow: none;
	background: transparent;
}

svg {
	#arrow-anatomy { --_hue: var(--hue-anatomy); }
	#arrow-removed { --_hue: var(--hue-removed); }
	#arrow-consequence { --_hue: var(--hue-consequence); }
	#arrow-benefit { --_hue: var(--hue-benefit); }
	#arrow-harm { --_hue: var(--hue-harm); }
	path:not(.edge-path) {
		transition: fill 0.3s ease;
		fill: oklch(var(--text-lightness) var(--text-chroma) var(--_hue));
	}

	path.edge-path {
		stroke-width: 3;
		color: #f0f;
		fill: currentColor;
		transition: stroke-opacity 0.3s, opacity 0.3s, stroke 0.3s ease, stroke-width 0.3s ease;
	}
}

#loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 18px; color: var(--text-muted); z-index: 100; }
</style>
</head>
<body>

<template id="card-template">
	<div class="card">
		<svg class="card-icon" viewBox="0 0 24 24"><use href=""></use></svg>
		<h3>Title</h3>
		<p>Content goes here...</p>
	</div>
</template>

<div id="app">
	<div id="loading">Loading database...</div>

	<div id="top-bar">
		<div id="breadcrumb-stack"></div>
		<div id="controls-container">
			<select id="category-filter">
				<option value="all">All Categories</option>
			</select>
			<div id="search-container">
				<input type="text" id="search-input" placeholder="Search ...">
				<div id="search-results"></div>
			</div>
		</div>
	</div>

	<div id="legend">
		<div class="legend-section-title">Connection Types</div>
		<div class="legend-item"><div class="legend-line anatomy"></div> Anatomy / Default</div>
		<div class="legend-item"><div class="legend-line removed"></div> Excised / Removed</div>
		<div class="legend-item"><div class="legend-line consequence"></div> Adverse Consequence</div>
		<div class="legend-item"><div class="legend-line benefit"></div> Claimed Benefit</div>
		<div class="legend-item"><div class="legend-line harm"></div> Claimed Harm</div>
		<div class="legend-divider"></div>
		<div class="legend-section-title">Biological Traits</div>
		<div class="legend-item"><div class="legend-text-icon male">Aa</div> Male</div>
		<div class="legend-item"><div class="legend-text-icon female">Aa</div> Female</div>
		<div class="legend-item"><div class="legend-text-icon shared">Aa</div> Shared</div>
	</div>

	<svg id="lines-layer">
		<defs id="svg-defs">
			<marker id="arrow-anatomy" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
				<path d="M 0 0 L 10 5 L 0 10 z" />
			</marker>
			<marker id="arrow-removed" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
				<path d="M 0 0 L 8 5 L 0 10 Z M 8 0 L 10 0 L 10 10 L 8 10 Z" />
			</marker>
			<marker id="arrow-consequence" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
				<path d="M 0 0 L 6 5 L 0 10 Z M 4 0 L 10 5 L 4 10 Z" />
			</marker>
			<marker id="arrow-benefit" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
				<path d="M 0 0 L 10 5 L 0 10 z" />
			</marker>
			<marker id="arrow-harm" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
				<path d="M 0 0 L 6 5 L 0 10 Z M 4 0 L 10 5 L 4 10 Z" />
			</marker>

			<marker id="start-marker" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
				<circle cx="5" cy="5" r="5" fill="context-stroke" />
			</marker>
			<marker id="end-marker" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
				<circle cx="5" cy="5" r="5" fill="context-stroke" />
			</marker>

			<g id="icon-region" fill="currentColor">
				<path d="M12,2A2,2 0 0,1 14,4A2,2 0 0,1 12,6A2,2 0 0,1 10,4A2,2 0 0,1 12,2M10.5,22V16H7.5V10A2,2 0 0,1 9.5,8H14.5A2,2 0 0,1 16.5,10V16H13.5V22H10.5Z" />
			</g>
			<g id="icon-organ" fill="currentColor">
				<circle cx="15" cy="14" r="5" />
				<circle cx="6" cy="16" r="2" />
				<circle cx="8" cy="7" r="3" />
			</g>
			<g id="icon-sexual" fill="currentColor">
				<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
			</g>
			<g id="icon-surgery" fill="currentColor">
				<path d="M21.5,5.5L18.5,2.5L14,2.5L7,11.5V14.5L2,19.5L4.5,22L9.5,17H12.5L21.5,10V5.5M12.9,9.4L11.5,8L15.4,3.5H17.2L20.5,6.8V8.6L12.9,9.4Z" />
			</g>
			<g id="icon-upgrade" fill="currentColor">
				<path d="M12,4L4,12H9V20H15V12H20L12,4M13,18H11V12H7.83L12,7.83L16.17,12H13V18M4,2H20V4H4V2Z" />
			</g>
			<g id="icon-downgrade" fill="currentColor">
				<path d="M12,20L20,12H15V4H9V12H4L12,20M11,6H13V12H16.17L12,16.17L7.83,12H11V6M4,22H20V20H4V22Z" />
			</g>
			<g id="icon-note">
				<path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2Zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1Zm7 16H5V5h2v2h10V5h2v14Z" fill="currentColor" />
			</g>
		</defs>
	</svg>
	<div id="nodes-layer"></div>
	<div id="copyright">
		&copy; 2026 <a href="https://x.com/MrBang21" target="_blank">@MrBang21</a>
	</div>
</div>

<script>
let nodes = [],
	edges = [],
	currentCenterId = '',
	currentCategoryFilter = 'all';

const
	nodesLayer = document.getElementById('nodes-layer'),
	linesLayer = document.getElementById('lines-layer'),
	defsHTML = document.getElementById('svg-defs').outerHTML,
	stackContainer = document.getElementById('breadcrumb-stack'),
	categoryFilterDropdown = document.getElementById('category-filter'),
	searchInput = document.getElementById('search-input'),
	searchResults = document.getElementById('search-results'),
	cardTemplate = document.getElementById('card-template');

const edgeStyles = {
	'anatomy':		{ color: 'oklch(var(--text-lightness) var(--text-chroma) var(--hue-anatomy))', width: '2', dash: 'none', marker: 'url(#arrow-anatomy)' },
	'removed':		{ color: 'oklch(var(--text-lightness) var(--text-chroma) var(--hue-removed))', width: '3', dash: '8, 4', marker: 'url(#arrow-removed)' },
	'consequence':	{ color: 'oklch(var(--text-lightness) var(--text-chroma) var(--hue-consequence))', width: '3', dash: 'none', marker: 'url(#arrow-consequence)' },
	'benefit':		{ color: 'oklch(var(--text-lightness) var(--text-chroma) var(--hue-benefit))', width: '3', dash: '4, 4', marker: 'url(#arrow-benefit)' },
	'harm':			{ color: 'oklch(var(--text-lightness) var(--text-chroma) var(--hue-harm))', width: '3', dash: '4, 4', marker: 'url(#arrow-harm)' }
};

let activeLineElements = [],
	animationLoopRunning = false;

async function loadGraphData() {
	try {
		const response = await fetch('human.json');
		if (!response.ok) throw new Error('Network response was not ok');
		const data = await response.json();

		nodes = data.nodes;
		edges = data.edges;

		if (data.categories) {
			data.categories.forEach(cat => {
				const option = document.createElement('option');
				option.value = cat;
				option.textContent = cat.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
				categoryFilterDropdown.appendChild(option);
			});
		}

		document.getElementById('loading').style.display = 'none';
		initGraph();
	} catch (error) {
		document.getElementById('loading').innerText = 'Error loading human.json. Ensure you are running a local server.';
	}
}

categoryFilterDropdown.addEventListener('change', (e) => {
	currentCategoryFilter = e.target.value;
	renderGraph(currentCenterId);
	if(searchInput.value) {
		searchInput.dispatchEvent(new Event('input'));
	}
});

function getIdFromHash() {
	const hash = window.location.hash.substring(1);
	return nodes.some(n => n.id === hash) ? hash : 'human';
}

function initGraph() {
	currentCenterId = getIdFromHash();

	nodes.forEach(node => {
		const clone = cardTemplate.content.cloneNode(true);
		const card = clone.querySelector('.card');
		const titleEl = clone.querySelector('h3');
		const contentEl = clone.querySelector('p');
		const useEl = clone.querySelector('use');

		const nodeType = node.type || 'anatomy';
		const nodeTrait = node.trait || 'shared';
		const nodeCategory = node.category || 'other';

		card.className = `card hidden type-${nodeType} trait-${nodeTrait} cat-${nodeCategory}`;
		card.id = `node-${node.id}`;

		titleEl.textContent = node.title;
		contentEl.textContent = node.content;
		useEl.setAttribute('href', `#icon-${nodeCategory}`);

		setupInteractions(card, node.id);
		nodesLayer.appendChild(clone);
	});

	renderGraph(currentCenterId);

	if (!animationLoopRunning) {
		animationLoopRunning = true;
		requestAnimationFrame(updateLinesLoop);
	}
}

searchInput.addEventListener('input', (e) => {
	const term = e.target.value.toLowerCase().trim();
	if (term.length < 2) {
		searchResults.style.display = 'none';
		return;
	}

	const matches = nodes.filter(n => {
		const
			matchesTerm = n.title.toLowerCase().includes(term) || n.content.toLowerCase().includes(term) || (n.aka && n.aka.toLowerCase().includes(term)),
			matchesFilter = currentCategoryFilter === 'all' || n.category === currentCategoryFilter;
		return matchesTerm && matchesFilter;
	});

	if (matches.length > 0) {
		searchResults.innerHTML = matches.map(m => `
			<div class="search-result-item" data-id="${m.id}">
				<div class="search-result-title">${m.title}</div>
				<div class="search-result-meta">${(m.category || 'misc').replace(/_/g, ' ')} • ${m.trait || 'shared'}</div>
			</div>
		`).join('');
		searchResults.style.display = 'block';

		document.querySelectorAll('.search-result-item').forEach(item => {
			item.addEventListener('click', () => {
				const id = item.getAttribute('data-id');
				history.pushState(null, null, '#' + id);
				renderGraph(id);
				searchInput.value = '';
				searchResults.style.display = 'none';
			});
		});
	} else {
		searchResults.innerHTML = '<div class="search-result-item">No results found for this category</div>';
		searchResults.style.display = 'block';
	}
});

document.addEventListener('click', (e) => {
	if (!document.getElementById('search-container').contains(e.target)) {
		searchResults.style.display = 'none';
	}
});

function setupInteractions(card, id) {
	let isDragging = false,
		hasMoved = false,
		startX, startY,
		initialLeft, initialTop;

	card.addEventListener('mousedown', (e) => {
		if (e.button !== 0) return;
		e.preventDefault();

		isDragging = true;
		hasMoved = false;
		startX = e.clientX;
		startY = e.clientY;

		card.classList.add('dragging');
		initialLeft = parseFloat(card.style.left) || 0;
		initialTop = parseFloat(card.style.top) || 0;

		document.addEventListener('mousemove', drag);
		document.addEventListener('mouseup', drop);
	});

	function drag(e) {
		if (!isDragging) return;
		const
			dx = e.clientX - startX,
			dy = e.clientY - startY;

		if (Math.abs(dx) > 3 || Math.abs(dy) > 3) hasMoved = true;

		card.style.left = `${initialLeft + dx}px`;
		card.style.top = `${initialTop + dy}px`;
	}

	function drop(e) {
		if (!isDragging) return;
		isDragging = false;
		document.removeEventListener('mousemove', drag);
		document.removeEventListener('mouseup', drop);
		card.classList.remove('dragging');

		if (!hasMoved && currentCenterId !== id) {
			history.pushState(null, null, '#' + id);
			renderGraph(id);
		}
	}
}

function getBreadcrumbPath(targetId) {
	const rootId = 'human';
	if (targetId === rootId) return [rootId];

	const
		targetNode = nodes.find(n => n.id === targetId),
		targetTrait = targetNode ? targetNode.trait : null;

	const findPath = (allowAllEdges) => {
		let adjList = {};
		edges.forEach(e => {
			const type = e.type || 'anatomy';
			if (allowAllEdges || (type === 'anatomy' || type === 'benefit' || type === 'consequence' || type === 'harm')) {
				if (!adjList[e.source]) adjList[e.source] = [];

				const edgeTargetData = nodes.find(n => n.id === e.target);
				if (!edgeTargetData) return;

				let weight = 1;

				if (targetTrait && edgeTargetData.trait !== targetTrait) {
					weight += 10;
					if (edgeTargetData.trait !== 'shared') weight += 50;
				}
				if (edgeTargetData.category !== 'anatomy' && edgeTargetData.category !== 'structure') {
					weight += 20;
				}
				if (edgeTargetData.category === 'other') {
					weight += 20;
				}

				adjList[e.source].push({ node: e.target, weight: weight });
			}
		});

		let distances = {};
		let previous = {};
		let unvisited = new Set(nodes.map(n => n.id));

		nodes.forEach(n => distances[n.id] = Infinity);
		distances[rootId] = 0;

		while (unvisited.size > 0) {
			let currNode = null;
			for (let id of unvisited) {
				if (currNode === null || distances[id] < distances[currNode]) {
					currNode = id;
				}
			}

			if (distances[currNode] === Infinity) break;
			if (currNode === targetId) break;

			unvisited.delete(currNode);

			let neighborsList = adjList[currNode] || [];
			for (let neighbor of neighborsList) {
				if (unvisited.has(neighbor.node)) {
					let alt = distances[currNode] + neighbor.weight;
					if (alt < distances[neighbor.node]) {
						distances[neighbor.node] = alt;
						previous[neighbor.node] = currNode;
					}
				}
			}
		}

		if (distances[targetId] === Infinity) return null;

		let path = [];
		let curr = targetId;
		while (curr) {
			path.unshift(curr);
			curr = previous[curr];
		}
		return path;
	};

	let path = findPath(false);
	if (!path) path = findPath(true);
	return path || [targetId];
}

function updateBreadcrumbs(centerId) {
	const path = getBreadcrumbPath(centerId);
	stackContainer.innerHTML = '';

	path.forEach((nodeId, index) => {
		const nodeData = nodes.find(n => n.id === nodeId);
		if (!nodeData) return;

		const
			isLast = index === path.length - 1,
			span = document.createElement('span');
		span.innerText = nodeData.title;

		if (isLast) {
			span.className = 'breadcrumb-current';
		} else {
			span.className = 'breadcrumb-item';
			span.onclick = () => {
				history.pushState(null, null, '#' + nodeId);
				renderGraph(nodeId);
			};
		}

		stackContainer.appendChild(span);

		if (!isLast) {
			const separator = document.createElement('span');
			separator.className = 'breadcrumb-separator';
			separator.innerText = '>';
			stackContainer.appendChild(separator);
		}
	});
}

function renderGraph(centerId) {
	currentCenterId = centerId;
	const
		centerX = window.innerWidth / 2,
		centerY = window.innerHeight / 2;

	updateBreadcrumbs(centerId);

	const path = getBreadcrumbPath(centerId);
	const parentId = path && path.length > 1 ? path[path.length - 2] : null;

	const
		centerNodeData = nodes.find(n => n.id === centerId),
		connectedEdges = edges.filter(e => e.source === centerId || e.target === centerId);

	let neighbors = connectedEdges.map(e => {
		const neighborId = e.source === centerId ? e.target : e.source;
		return {
			node: nodes.find(n => n.id === neighborId),
			isOutgoing: e.source === centerId,
			edgeType: e.type || 'anatomy'
		};
	}).filter(item => item.node !== undefined);

	if (parentId) {
		const pIdx = neighbors.findIndex(item => item.node.id === parentId);
		if (pIdx > 0) {
			neighbors.unshift(neighbors.splice(pIdx, 1)[0]);
		}
	}

	document.querySelectorAll('.card').forEach(el => {
		el.classList.add('hidden');
		el.classList.remove('center-node');
		el.classList.remove('ghosted');
		el.classList.remove('parent');
		el.classList.remove('source');
		el.classList.remove('target');
	});

	linesLayer.innerHTML = defsHTML;
	activeLineElements = [];

	const centerEl = document.getElementById(`node-${centerId}`);
	if(!centerEl) return;

	centerEl.classList.remove('hidden');
	centerEl.classList.add('center-node');

	const centerMatches = currentCategoryFilter === 'all' || centerNodeData.category === currentCategoryFilter;
	if (!centerMatches) centerEl.classList.add('ghosted');

	centerEl.style.left = `${centerX}px`;
	centerEl.style.top = `${centerY}px`;

	const radius = Math.min(centerX, centerY) * 0.75;

	neighbors.forEach((neighborData, index) => {
		const el = document.getElementById(`node-${neighborData.node.id}`);
		if (!el) return;

		el.classList.remove('hidden');

		if (neighborData.isOutgoing) {
			el.classList.add('target');
		} else {
			el.classList.add('source');
		}

		if (neighborData.node.id === parentId) {
			el.classList.add('parent');
		}

		const neighborMatches = currentCategoryFilter === 'all' || neighborData.node.category === currentCategoryFilter;
		if (!neighborMatches) el.classList.add('ghosted');

		const
			angle = (index / neighbors.length) * 2 * Math.PI - (Math.PI / 2),
			nx = centerX + radius * Math.cos(angle),
			ny = centerY + radius * Math.sin(angle);

		el.style.left = `${nx}px`;
		el.style.top = `${ny}px`;

		const pathLine = document.createElementNS('http://www.w3.org/2000/svg', 'path');
		pathLine.classList.add('edge-path');

		const style = edgeStyles[neighborData.edgeType];

		pathLine.setAttribute('stroke', style.color);
		pathLine.style.color = style.color;

		pathLine.setAttribute('marker-mid', style.marker);
		pathLine.setAttribute('marker-start', 'url(#start-marker)');
		pathLine.setAttribute('marker-end', 'url(#end-marker)');
		pathLine.setAttribute('fill', style.color);

		if (!neighborMatches) pathLine.setAttribute('opacity', '0.25');

		if (style.dash !== 'none') pathLine.setAttribute('stroke-dasharray', style.dash);

		linesLayer.appendChild(pathLine);

		activeLineElements.push({
			line: pathLine,
			centerEl: centerEl,
			neighborEl: el,
			isOutgoing: neighborData.isOutgoing
		});
	});
}

function updateLinesLoop() {
	activeLineElements.forEach(item => {
		const
			centerRect = item.centerEl.getBoundingClientRect(),
			neighborRect = item.neighborEl.getBoundingClientRect(),
			cx = centerRect.left + centerRect.width / 2,
			cy = centerRect.top + centerRect.height / 2,
			nx = neighborRect.left + neighborRect.width / 2,
			ny = neighborRect.top + neighborRect.height / 2;

		let startX, startY, endX, endY;

		if (item.isOutgoing) {
			startX = cx; startY = cy; endX = nx; endY = ny;
		} else {
			startX = nx; startY = ny; endX = cx; endY = cy;
		}

		const
			midX = (startX + endX) / 2,
			midY = (startY + endY) / 2;

		item.line.setAttribute('d', `M ${startX} ${startY} L ${midX} ${midY} L ${endX} ${endY}`);
	});

	requestAnimationFrame(updateLinesLoop);
}

window.addEventListener('resize', () => {
	if(nodes.length > 0) renderGraph(currentCenterId);
});

window.addEventListener('hashchange', () => {
	if(nodes.length > 0) {
		const newId = getIdFromHash();
		if (newId !== currentCenterId) renderGraph(newId);
	}
});

loadGraphData();
</script>
</body>
</html>
